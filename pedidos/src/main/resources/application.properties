spring.application.name=pedidos
server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pedidos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${db_password:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
# Docker/Swarm secrets: cada archivo de /run/secrets pasa a ser una propiedad
spring.config.import=optional:configtree:/run/secrets/

# Cola SQS (vacia = productor deshabilitado)
aws.region=${AWS_REGION:us-east-1}
aws.sqs.queue-url=${SQS_QUEUE_URL:}
