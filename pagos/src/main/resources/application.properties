spring.application.name=pagos
server.port=${SERVER_PORT:8084}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pagos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${db_password:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
# Docker/Swarm secrets: cada archivo de /run/secrets pasa a ser una propiedad
spring.config.import=optional:configtree:/run/secrets/
