services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_USER: tienda
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - mysql_root_password
      - db_password
    configs:
      - source: init_sql
        target: /docker-entrypoint-initdb.d/init.sql
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$(cat /run/secrets/mysql_root_password) --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tienda-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  usuarios:
    image: registry:5000/usuarios:1.0
    environment:
      DB_URL: jdbc:mysql://mysql:3306/usuarios_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: tienda
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    secrets:
      - db_password
      - jwt_secret
    ports:
      - "8081:8081"
    networks:
      - tienda-net
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 384M

  productos:
    image: registry:5000/productos:1.0
    environment:
      DB_URL: jdbc:mysql://mysql:3306/productos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: tienda
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    secrets:
      - db_password
    ports:
      - "8082:8082"
    networks:
      - tienda-net
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 384M

  pedidos:
    image: registry:5000/pedidos:1.0
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pedidos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: tienda
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    secrets:
      - db_password
    ports:
      - "8083:8083"
    networks:
      - tienda-net
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 384M

  pagos:
    image: registry:5000/pagos:1.0
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pagos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: tienda
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    secrets:
      - db_password
    ports:
      - "8084:8084"
    networks:
      - tienda-net
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 384M

  envios:
    image: registry:5000/envios:1.0
    environment:
      DB_URL: jdbc:mysql://mysql:3306/envios_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: tienda
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    secrets:
      - db_password
    ports:
      - "8085:8085"
    networks:
      - tienda-net
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 384M

secrets:
  mysql_root_password:
    external: true
  db_password:
    external: true
  jwt_secret:
    external: true

configs:
  init_sql:
    file: ./init-databases.sql

volumes:
  mysql_data:

networks:
  tienda-net:
    driver: overlay
