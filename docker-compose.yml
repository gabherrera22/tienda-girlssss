name: tienda-girlssss

services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: tienda
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts-db/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tienda-net

  usuarios:
    build: ./usuarios
    image: usuarios:1.0
    container_name: usuarios
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/usuarios_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: tienda
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tienda-net

  productos:
    build: ./productos
    image: productos:1.0
    container_name: productos
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/productos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: tienda
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tienda-net

  pedidos:
    build: ./pedidos
    image: pedidos:1.0
    container_name: pedidos
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pedidos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: tienda
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tienda-net

  pagos:
    build: ./pagos
    image: pagos:1.0
    container_name: pagos
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pagos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: tienda
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tienda-net

  envios:
    build: ./envios
    image: envios:1.0
    container_name: envios
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/envios_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: tienda
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tienda-net

volumes:
  mysql_data:

networks:
  tienda-net:
    driver: bridge